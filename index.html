<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NI KO GAME SHOP</title>
<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial}
header{text-align:center;padding:25px;background:#172747}
h1{color:#39d5ff}
h2{color:#42d5ff}
.card{background:#192844;margin:15px;padding:18px;border-radius:15px}
button,select,input{width:100%;padding:13px;margin:7px 0;
border:0;border-radius:9px;box-sizing:border-box}
button{background:#168cff;color:white;font-weight:bold}
select,input{background:#e9efff;color:#111}
.price{padding:9px;border-bottom:1px solid #34435e}
small{color:#aabbd6}
</style>
</head>
<body>

<header>
<h1>🎮 NI KO GAME SHOP</h1>
<p>GAME TOP UP CENTER</p>
</header>

<div class="card">
<h2>💎 MLBB DIAMOND</h2>
<div id="mlbb"></div>
</div>

<div class="card">
<h2>🎮 PUBG UC</h2>
<h3>👑 Special UC</h3>
<div id="special"></div>
<h3>🌐 CN Web Global</h3>
<div id="global"></div>
</div>

<div class="card">
<h2>📦 ORDER မှာယူရန်</h2>
<select id="game">
<option>MLBB Diamond</option>
<option>PUBG Special UC</option>
<option>PUBG CN Web Global</option>
</select>
<input id="package" placeholder="ဝယ်ယူမည့် Package">
<input id="player" placeholder="Player ID">
<input id="server" placeholder="Server ID">
<input id="name" placeholder="သင့်အမည်">
<button onclick="order()">ORDER တင်မယ်</button>
<p id="result"></p>
</div>

<div class="card">
<h2>💰 ငွေပေးချေမှု</h2>
<p>Wave Money</p>
<p>ငွေလွှဲနံပါတ် - 09682380920</p>
<p>Wave အမည် - Pan Ei Zin</p>
<small>ငွေလွှဲပြီး ပြေစာနှင့် Order အချက်အလက်ကို တွဲပို့ပေးပါ။</small>
</div>

<script>
const mlbb=[
["Weekly Pass","6700"],
["Twilight Pass","36000"],
["Weekly Elite Bundle","3550"],
["Monthly Epic Bundle","17600"],
["86 Diamond","5500"],
["172 Diamond","10900"],
["257 Diamond","15900"],
["343 Diamond","21400"],
["429 Diamond","26800"],
["514 Diamond","31700"],
["600 Diamond","37200"],
["706 Diamond","42900"],
["878 Diamond","53800"],
["963 Diamond","58700"],
["1049 Diamond","64200"],
["1135 Diamond","69600"],
["1220 Diamond","74600"],
["1412 Diamond","85700"],
["2195 Diamond","129700"],
["3688 Diamond","216400"],
["5532 Diamond","326700"],
["9288 Diamond","542600"],
["50+50 Double","3550"],
["150+150 Double","10500"],
["250+250 Double","16800"],
["500+500 Double","34400"]
];
const special=[
["336 UC","20800"],
["672 UC","40250"],
["1008 UC","59650"],
["1344 UC","79000"]
];
const global=[
["325 UC","20000"],
["660 UC","39900"],
["1800 UC","99000"],
["3850 UC","199000"],
["8100 UC","395000"]
];
function show(id,data){
document.getElementById(id).innerHTML=data.map(x=>
`<div class="price">${x[0]} = <b>${Number(x[1]).toLocaleString()} Ks</b></div>`
).join("");
}
show("mlbb",mlbb);
show("special",special);
show("global",global);

function order(){
let msg="NI KO GAME SHOP ORDER\n"+
"Game: "+game.value+"\n"+
"Package: "+package.value+"\n"+
"Player ID: "+player.value+"\n"+
"Server ID: "+server.value+"\n"+
"Name: "+name.value;
if(!package.value||!player.value||!name.value){
alert("အချက်အလက်တွေ ဖြည့်ပေးပါ");
return;
}
document.getElementById("result").innerText=
"Order အချက်အလက်:\n"+msg+
"\nအချက်အလက်ကို Copy လုပ်ပြီး Bot ထဲ ပို့ပေးပါ။";
navigator.clipboard?.writeText(msg);
}
</script>
</body>
</html>
