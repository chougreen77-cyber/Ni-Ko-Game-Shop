
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NI KO GAME SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 12px;background:#17264a}
header h1{color:#65e1ff;margin:0}
header p{color:#ccc}
main{max-width:1000px;margin:auto;padding:15px}
h2{font-size:21px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.game{background:#192744;border:1px solid #344b70;border-radius:13px;padding:15px;text-align:center;cursor:pointer}
.game.active{border:2px solid #65e1ff}
.game img{width:100%;height:100px;object-fit:cover;border-radius:9px}
.game strong{display:block;margin-top:9px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.product{background:#192744;padding:13px;border-radius:10px;border:1px solid #344b70;cursor:pointer}
.product b{display:block;color:#ffd166;margin-top:8px}
.product.selected{border:2px solid #65e1ff}
.order{background:#192744;padding:17px;border-radius:13px;margin-top:25px}
input,textarea{width:100%;padding:12px;margin:7px 0;background:#0b1020;color:white;border:1px solid #456;border-radius:8px}
button{background:#65dfff;color:#071322;padding:13px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
#send{width:100%;margin-top:12px}
.note{color:#bbb;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<header>
<h1>NI KO GAME SHOP</h1>
<p>💎 GAME TOP UP • FAST SERVICE</p>
</header>
<main>
<h2>🎮 Select Game</h2>
<div class="games" id="games"></div>
<h2 id="heading">📦 Packages</h2>
<div class="products" id="products"></div>

<div class="order">
<h2>🛒 Order Now</h2>
<input id="chosen" placeholder="ရွေးထားသော Package" readonly>
<input id="uid" placeholder="Game ID / UID">
<input id="server" placeholder="Server ID (လိုအပ်ပါက)">
<input id="username" placeholder="Telegram Username">
<textarea id="note" placeholder="မှတ်ချက် (မဖြစ်မနေမဟုတ်ပါ)"></textarea>
<button id="send">Order ပို့ရန်</button>
<p class="note">Order အချက်အလက်ကို Admin ထံ Telegram ဖြင့်ပို့ရန်ဖြစ်သည်။ ငွေပေးချေမှုကို အလိုအလျောက် စစ်ဆေးခြင်းမရှိပါ။</p>
</div>
</main>
<script>
const data=[

["Standard Purchase Rebate Pack",1840],["Premium Purchase Rebate Pack",5984],["Honor Point Value Pack",1840]]}
];
let active=0,selected=null;
function render(){
let g=document.getElementById("games");
g.innerHTML="";
data.forEach((x,i)=>{
let b=document.createElement("div");
b.className="game"+(i===active?" active":"");
b.innerHTML=`<img src="${x.img}" alt="${x.name}" onerror="this.style.display='none'"><strong>${x.name}</strong>`;
b.onclick=()=>{active=i;selected=null;document.getElementById("chosen").value="";render()};
g.appendChild(b);
});
let x=data[active];
document.getElementById("heading").textContent="📦 "+x.name+" Packages";
let p=document.getElementById("products");
p.innerHTML="";
x.items.forEach(([name,price])=>{
let b=document.createElement("div");
b.className="product";
b.innerHTML=`${name}<b>${price.toLocaleString()} Ks</b>`;
b.onclick=()=>{
selected={game:x.name,name,price};
document.getElementById("chosen").value=name+" - "+price.toLocaleString()+" Ks";
document.querySelectorAll(".product").forEach(el=>el.classList.remove("selected"));
b.classList.add("selected");
};
p.appendChild(b);
});
}
document.getElementById("send").onclick=()=>{
if(!selected){alert("Package အရင်ရွေးပါ");return}
let uid=document.getElementById("uid").value.trim();
if(!uid){alert("Game ID ထည့်ပါ");return}
let msg=`NI KO GAME SHOP ORDER
Game: ${selected.game}
Package: ${selected.name}
Price: ${selected.price} Ks
Game ID: ${uid}
Server: ${document.getElementById("server").value}
Telegram: ${document.getElementById("username").value}
Note: ${document.getElementById("note").value}`;
window.open("https://t.me/Nshdndhd?text="+encodeURIComponent(msg),"_blank");
};
render();
</script>
</body>
</html>
